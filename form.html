<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <u><h1 align="center">Registration Form</h1></u>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label for="name">Name:</label>
            <select>
                    <option>Mr.</option>
	<option>Mrs.</option>
	<option>Miss.</option>
            </select>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="phone">Phone No:</label>
            <input type="tel" id="phone" name="phone" required>
            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="30"></textarea>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>
            <input type="radio"><label>confirm the above details</label>
<br><br>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </fieldset>
    </form>
<form>
<input type="radio" name="fav_language"
 value="html">HTML
<input type="radio" name="fav_language" value="css"> CSS
</form>
</body>
</html>
